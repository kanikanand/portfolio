<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Risograph Draw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #F2E8DC; touch-action: none; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: monospace; font-size: 13px; color: #555; opacity: 0.7;
    pointer-events: none; letter-spacing: 0.08em; transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div id="hint">move cursor to draw</div>

<script src="p5.min.js"></script>

<script>
// ─── GLOBAL CONFIGURATION ──────────────────────────────────────────
const BG_COLOR         = '#F2E8DC';   // paper background
const OUTLINE_COLOR    = '#1A1010';   // path stroke
const GRAIN_COLOR      = '#1A1010';   // noise grain color

// Risograph ink palette (checks fill)
const PALETTE = [
  '#E8453C',  // red
  '#E8873C',  // orange
  '#F5C842',  // yellow
  '#3CB87A',  // green
  '#2E5FAA',  // blue
  '#8B3CC8',  // purple
  '#E84C8B',  // pink
  '#3CC8C8',  // teal
];

const STRIPE_DARK  = '#1A1010';
const STRIPE_LIGHT = '#F2E8DC';
const GRAIN_DARK   = '#1A1010';
const GRAIN_LIGHT  = '#F2E8DC';

// Minimum distance (px) between two opposite outline points to form a polygon
const CONNECTION_THRESHOLD = 30;

// Points to resample path to before building polygons
const SAMPLE_COUNT = 100;

// Dots per px² for the noise fill
const GRAIN_DENSITY = 0.18;

// Minimum px gap between recorded drag points (deduplicate micro-jitter)
const MIN_DRAG_STEP = 6;
// ───────────────────────────────────────────────────────────────────

let isDrawing  = false;
let rawPath    = [];      // live drag points
let drawnPath  = [];      // final resampled contour
let polygons   = [];      // filled quads
let grainLayer;

const hint = document.getElementById('hint');

new p5(function(p) {

  // ── math helpers ─────────────────────────────────────────────────

  function dist2(a, b) { return (a.x - b.x) ** 2 + (a.y - b.y) ** 2; }

  function resample(pts, n) {
    if (pts.length < 2) return pts.slice();
    const arcs = [0];
    for (let i = 1; i < pts.length; i++) {
      const dx = pts[i].x - pts[i-1].x, dy = pts[i].y - pts[i-1].y;
      arcs.push(arcs[i-1] + Math.sqrt(dx*dx + dy*dy));
    }
    const total = arcs[arcs.length - 1];
    const out = [];
    for (let s = 0; s < n; s++) {
      const target = (s / n) * total;
      let lo = 0, hi = arcs.length - 1;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (arcs[mid] <= target) lo = mid; else hi = mid;
      }
      const t = (target - arcs[lo]) / (arcs[hi] - arcs[lo] || 1);
      out.push({
        x: pts[lo].x + t * (pts[hi].x - pts[lo].x),
        y: pts[lo].y + t * (pts[hi].y - pts[lo].y),
      });
    }
    return out;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── polygon builder ───────────────────────────────────────────────
  // Connects point i to its opposite (i + n/2) when distance > threshold,
  // forming a quad from (i, i+1, opp+1, opp).

  function buildPolygons(contour) {
    const n = contour.length;
    const half = Math.floor(n / 2);
    const polys = [];
    const fillTypes = ['checks', 'stripes', 'noise'];

    for (let i = 0; i < half; i++) {
      const a   = contour[i];
      const b   = contour[(i + 1) % n];
      const opp = (i + half) % n;
      const c   = contour[opp];
      const d   = contour[(opp + 1) % n];

      if (dist2(a, c) < CONNECTION_THRESHOLD * CONNECTION_THRESHOLD) continue;

      const ft = pick(fillTypes);
      const colors = ft === 'checks'
        ? shuffle(PALETTE).slice(0, 2)
        : [STRIPE_DARK, STRIPE_LIGHT];

      polys.push({ verts: [a, b, d, c], fillType: ft, colors, stripeAngle: Math.random() * Math.PI });
    }
    return polys;
  }

  // ── pattern fills (each clips to the polygon) ─────────────────────

  function drawChecks(ctx, verts, c1, c2, size) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const v of verts) {
      if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    }
    const sx = Math.floor(minX / size) * size;
    const sy = Math.floor(minY / size) * size;
    for (let gy = sy; gy < maxY; gy += size) {
      for (let gx = sx; gx < maxX; gx += size) {
        ctx.fillStyle = ((Math.floor(gx/size) + Math.floor(gy/size)) % 2 === 0) ? c1 : c2;
        ctx.fillRect(gx, gy, size, size);
      }
    }
  }

  function drawStripes(ctx, verts, c1, c2, width, angle) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const v of verts) {
      if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    }
    const diag = Math.sqrt((maxX - minX) ** 2 + (maxY - minY) ** 2) + width * 2;
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    const n = Math.ceil(diag / width) + 2;
    for (let i = -n; i <= n; i++) {
      ctx.fillStyle = i % 2 === 0 ? c1 : c2;
      ctx.fillRect(i * width - width / 2, -diag / 2, width, diag);
    }
    ctx.restore();
  }

  function drawNoise(ctx, verts, c1, c2) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const v of verts) {
      if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    }
    ctx.fillStyle = c2;
    ctx.fillRect(minX, minY, maxX - minX, maxY - minY);
    const count = Math.floor((maxX - minX) * (maxY - minY) * GRAIN_DENSITY);
    ctx.fillStyle = c1;
    for (let i = 0; i < count; i++) {
      ctx.fillRect(minX + Math.random() * (maxX - minX), minY + Math.random() * (maxY - minY), 1.5, 1.5);
    }
  }

  function clipAndDraw(p, poly) {
    const { verts, fillType, colors } = poly;
    const ctx = p.drawingContext;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
    ctx.clip();
    const size = Math.max(10, p.width * 0.022);
    if (fillType === 'checks')       drawChecks(ctx, verts, colors[0], colors[1], size);
    else if (fillType === 'stripes') drawStripes(ctx, verts, colors[0], colors[1], size * 0.65, poly.stripeAngle);
    else                             drawNoise(ctx, verts, GRAIN_DARK, GRAIN_LIGHT);
    ctx.restore();
  }

  // ── grain overlay ─────────────────────────────────────────────────

  function buildGrain(p) {
    const g = p.createGraphics(p.width, p.height);
    g.noStroke();
    g.fill(GRAIN_COLOR + '1A');
    const dots = Math.floor(p.width * p.height * 0.035);
    for (let i = 0; i < dots; i++) {
      g.ellipse(Math.random() * p.width, Math.random() * p.height, 1.2, 1.2);
    }
    return g;
  }

  // ── draw interaction ──────────────────────────────────────────────
  // Drawing starts the moment the cursor/finger moves — no press needed.
  // Stopping movement for DEBOUNCE_MS triggers the risograph fill.

  const DEBOUNCE_MS = 700;
  let debounceTimer = null;

  function armDebounce() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(endDraw, DEBOUNCE_MS);
  }

  function onMove(x, y) {
    if (!isDrawing) {
      // Start fresh on first movement
      isDrawing = true;
      rawPath   = [{ x, y }];
      drawnPath = [];
      polygons  = [];
      hint.style.opacity = '0';
    } else {
      const last = rawPath[rawPath.length - 1];
      if (dist2({ x, y }, last) < MIN_DRAG_STEP * MIN_DRAG_STEP) return;
      rawPath.push({ x, y });
    }
    armDebounce();
    p.redraw();
  }

  function endDraw() {
    clearTimeout(debounceTimer);
    if (!isDrawing) return;
    isDrawing = false;

    if (rawPath.length < 12) {
      rawPath = [];
      p.redraw();
      hint.style.opacity = '0.7';
      return;
    }

    drawnPath = resample(rawPath, SAMPLE_COUNT);
    polygons  = buildPolygons(drawnPath);
    p.redraw();
  }

  // ── p5 lifecycle ──────────────────────────────────────────────────

  p.setup = function() {
    const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
    p.noLoop();
    grainLayer = buildGrain(p);

    // Touch — move starts/continues drawing, lift ends it
    cnv.elt.addEventListener('touchmove', e => {
      e.preventDefault();
      const r = cnv.elt.getBoundingClientRect();
      const t = e.touches[0];
      onMove(t.clientX - r.left, t.clientY - r.top);
    }, { passive: false });

    cnv.elt.addEventListener('touchend', e => {
      e.preventDefault();
      endDraw();
    }, { passive: false });
  };

  // Mouse move (no button required) and drag (button held) both feed onMove
  p.mouseMoved  = function() { onMove(p.mouseX, p.mouseY); };
  p.mouseDragged = function() { onMove(p.mouseX, p.mouseY); };

  p.draw = function() {
    p.background(BG_COLOR);

    if (isDrawing) {
      // Live path preview while dragging
      if (rawPath.length > 1) {
        p.noFill();
        p.stroke(OUTLINE_COLOR);
        p.strokeWeight(2);
        p.beginShape();
        for (const pt of rawPath) p.vertex(pt.x, pt.y);
        p.endShape();
      }
      return;
    }

    // Finished: filled polygons + grain only (no outline)
    for (const poly of polygons) clipAndDraw(p, poly);
    if (grainLayer) p.image(grainLayer, 0, 0);
  };

  p.windowResized = function() {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
    grainLayer = buildGrain(p);
    p.redraw();
  };
});
</script>
</body>
</html>
